name: Ticket watcher

# GitHub runs scheduled workflows best-effort and drops high-frequency ones
# under load. A */5 schedule produced zero runs in 28 minutes on this repo.
# So the schedule only has to land ONCE per half hour: each run then polls
# internally for 55 minutes. If a trigger is dropped, the next one recovers,
# and because concurrency queues at most one run, coverage is continuous.
on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert instead of watching"
        type: boolean
        default: false
      minutes:
        description: "How long this run should watch for"
        type: string
        default: "55"

concurrency:
  group: ticket-watcher
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    # Pinned deliberately. ubuntu-latest migrates to Ubuntu 26 on 2026-10-19,
    # which lands inside the window where this watcher must not break.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WATCH_URLS: https://www.diljitdosanjh.com/tour/ahmedabad/,https://www.diljitdosanjh.com/tour/
      STATE_FILE: state/ci-state.json
      INTERVAL_SECONDS: "60"
      HEARTBEAT_HOURS: "24"
      OPEN_BROWSER: "0"
      SPEAK: "0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Send test alert
        if: inputs.test_alert
        run: node watcher.mjs --test-alert

      - name: Watch pages
        if: ${{ !inputs.test_alert }}
        run: |
          MINUTES="${{ inputs.minutes || '55' }}"
          node watcher.mjs --minutes="${MINUTES}"

      - name: Commit state
        if: ${{ always() && !inputs.test_alert }}
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "no state change"
            exit 0
          fi
          git config user.name "diljitbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: page state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1

      # The schedule above has proven unreliable on this repo, so each healthy run
      # triggers its successor. workflow_dispatch is the documented exception to
      # the rule that GITHUB_TOKEN-triggered events cannot start a workflow, so
      # this needs no personal access token. Only a successful run chains, which
      # stops a cancelled or failing run from spawning duplicates, and the cron
      # remains as the restarter if the chain ever breaks.
      - name: Chain the next run
        if: ${{ success() && !inputs.test_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt "20261201" ]; then
            echo "past the show date, not chaining"
            exit 0
          fi
          gh workflow run "Ticket watcher" -f minutes=55
          echo "next run queued"

      - name: Alert on watcher failure
        if: failure()
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ diljitbot workflow FAILED. The watcher may be blind. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
